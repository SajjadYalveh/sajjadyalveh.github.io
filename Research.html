  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --accent: #1f4b6e;
      --accent-light: #eaf1f6;
      --border: #e3e7eb;
      --max-width: 1050px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.75;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .nav-inner {
      max-width: var(--max-width);
      margin: auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      font-family: Arial, sans-serif;
      font-size: 0.92rem;
    }

    .nav-links a {
      color: var(--text);
    }

    .nav-links a.active {
      color: var(--accent);
      font-weight: 600;
    }

    .container {
      max-width: var(--max-width);
      margin: auto;
      padding: 70px 24px 90px;
    }

    .page-header {
      max-width: 850px;
      margin-bottom: 65px;
    }

    .eyebrow {
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.15;
      margin-bottom: 22px;
      font-weight: 600;
    }

    .lead {
      font-size: 1.18rem;
      color: var(--muted);
      max-width: 780px;
    }

    section {
      margin-bottom: 65px;
    }

    h2 {
      font-size: 1.65rem;
      margin-bottom: 22px;
      font-weight: 600;
    }

    h3 {
      font-size: 1.15rem;
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 18px;
    }

    .research-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      margin-top: 25px;
    }

    .concept-chain {
      margin: 30px 0;
      padding: 26px;
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    .concept-chain span {
      margin: 0 7px;
      color: var(--accent);
      font-weight: 600;
    }

    .concept-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      margin-top: 25px;
    }

    .concept {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px;
    }

    .concept strong {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      margin-bottom: 5px;
      color: var(--accent);
    }

    .questions {
      list-style: none;
      margin-top: 20px;
    }

    .questions li {
      position: relative;
      padding: 14px 0 14px 28px;
      border-bottom: 1px solid var(--border);
    }

    .questions li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: bold;
    }

    .areas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 25px;
    }

    .area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
    }

    .area h3 {
      color: var(--accent);
    }
